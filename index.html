<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neumorphism Login Form</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #e0e5ec;
    padding: 40px 20px;
  }

  .title {
    text-align: center;
    color: #2f8f9d;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 30px;
    line-height: 1.3;
  }

  .card {
    width: 320px;
    background: #e0e5ec;
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 9px 9px 16px #b8bcc2, -9px -9px 16px #ffffff;
    text-align: center;
  }

  .logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 6px 6px 12px #b8bcc2, -6px -6px 12px #ffffff;
  }

  .logo span {
    color: #4dd0e1;
    font-weight: bold;
    font-size: 12px;
  }

  h2 {
    color: #333;
    font-size: 20px;
    margin-bottom: 4px;
  }

  .subtitle {
    color: #888;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 30px;
  }

  .input-group {
    position: relative;
    margin-bottom: 20px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 45px;
    border: none;
    border-radius: 50px;
    background: #e0e5ec;
    box-shadow: inset 5px 5px 10px #b8bcc2, inset -5px -5px 10px #ffffff;
    outline: none;
    font-size: 14px;
    color: #333;
  }

  .input-group input::placeholder {
    color: #9aa0a6;
  }

  .input-group .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #9aa0a6;
    font-size: 16px;
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(145deg, #5bc0d8, #4aa8c0);
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 5px 5px 10px #b8bcc2, -5px -5px 10px #ffffff;
    transition: transform 0.15s ease;
    margin-top: 10px;
  }

  .login-btn:hover {
    transform: translateY(-2px);
  }

  .login-btn:active {
    transform: translateY(0);
    box-shadow: inset 3px 3px 6px #3a8ba0, inset -3px -3px 6px #6ad4ee;
  }

  .links {
    margin-top: 18px;
    font-size: 12px;
    color: #666;
  }

  .links a {
    color: #333;
    font-weight: 600;
    text-decoration: none;
  }

  .links a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="title">Neumorphism Login Form<br>HTML &amp; CSS</div>

  <div class="card">
    <div class="logo"><span>Web Dev</span></div>
    <h2>Web Development</h2>
    <div class="subtitle">MADE EASY!</div>

    <div class="input-group">
      <span class="icon">&#128100;</span>
      <input type="text" placeholder="username">
    </div>

    <div class="input-group">
      <span class="icon">&#128274;</span>
      <input type="password" placeholder="password">
    </div>

    <button class="login-btn">Login</button>

    <div class="links">
      <a href="#">Forgot password?</a> or <a href="#">Sign Up</a>
    </div>
  </div>

</body>
</html>
